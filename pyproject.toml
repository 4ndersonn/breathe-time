[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breathe-time"
version = "1.0.0"
description = "Plataforma de análise e visualização de dados sobre saúde mental, bem-estar e psicologia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "requests==2.31.0",
    "python-dotenv==1.0.1"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "backend/tests"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["notebooks/", "venv/"]
